[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anybridge"
version = "0.4.0"
description = "Expose any web page to any agent — as an MCP server or as tools you import"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Vincenzo" }]
keywords = ["webmcp", "mcp", "agents", "browser", "langchain", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0",
    "playwright>=1.45",
    "pydantic>=2.0",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]

[project.urls]
Homepage = "https://github.com/vincenzo/anybridge"
Repository = "https://github.com/vincenzo/anybridge"

[project.scripts]
anybridge = "anybridge.cli:main"

[tool.setuptools]
packages = ["anybridge"]

[tool.setuptools.package-data]
anybridge = ["shim.js", "pagetools.js"]
