[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anybridge"
version = "1.0.0"
description = "Portable website capabilities, sessions, and repositories for any MCP agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Vincenzo" }]
keywords = ["webmcp", "mcp", "agents", "browser", "git", "langchain", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0",
    "playwright>=1.45",
    "pydantic>=2.0",
    "textual>=8.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "pypdf>=5.0",
    "cryptography>=42",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
fast = ["lightpanda-py>=0.2.8"]

[project.urls]
Homepage = "https://github.com/JustVugg/anybridge"
Repository = "https://github.com/JustVugg/anybridge"

[project.scripts]
anybridge = "anybridge.cli:main"
anybridge-tui = "anybridge.tui:main"

[tool.setuptools]
packages = ["anybridge"]

[tool.setuptools.package-data]
anybridge = ["shim.js", "pagetools.js"]
